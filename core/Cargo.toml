[package]
name = "jarvis-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "JARVIS offline-first voice assistant core: audio, VAD, wake, ASR, LLM streaming, TTS chunking, session state."

[lib]
name = "jarvis_core"
# cdylib for Android via cargo-ndk, rlib for tests/benches, staticlib for embedding.
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = ["jni-bridge"]
# JNI surface used by the Android app. Compiles on the host (jni is a pure binding);
# it only *runs* inside a JVM.
jni-bridge = ["dep:jni"]
# On-device Whisper transcription. Requires an NDK toolchain and a ggml model.
whisper = ["dep:whisper-rs"]
# Optional on-device GGUF reasoning through llama.cpp. This pulls in a C/C++
# build; see docs/OFFLINE_BUILD.md. Not compiled by default.
local-llm = ["dep:llama-cpp-2"]
local-tts = []
silero-vad = []

[dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
eventsource-stream = "0.2.3"
rtrb = "0.4"
parking_lot = "0.13"
aes-gcm = "0.11"
getrandom = "0.4"
base64 = "0.23"
tracing = "0.1"
jni = { version = "0.21", optional = true }
whisper-rs = { version = "0.16", optional = true }
llama-cpp-2 = { version = "0.1.161", optional = true }

[dev-dependencies]
criterion = "0.8"
tempfile = "3"

[[bench]]
name = "latency"
harness = false
